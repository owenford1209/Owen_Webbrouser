services:
  - type: web
    name: backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port=$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: MONGODB_URI
        value: "mongodb+srv://owenanderson:<db_password>@owencluster.zf8ctxx.mongodb.net/?retryWrites=true&w=majority&appName=OwenCluster"
      - key: DB_NAME
        value: OwenCluster
    plan: free
    rootDir: backend
    autoDeploy: true

  - type: web
    name: frontend
    env: node
    buildCommand: yarn install && yarn build
    startCommand: npx serve -s build -l 3000
    envVars:
      - key: NODE_VERSION
        value: 21.1.0
    plan: free
    rootDir: frontend
    autoDeploy: true 
